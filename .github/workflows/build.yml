name: Build OWN CLIENT

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build Client
        run: gradle build

      - name: Upload OWN CLIENT JAR
        uses: actions/upload-artifact@v4
        with:
          name: OWN-CLIENT-JAR
          path: build/libs/*.jar
